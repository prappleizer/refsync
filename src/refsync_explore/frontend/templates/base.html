<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}refsync explore{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b31b1b'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3Er%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint
    try {
      const t = localStorage.getItem("explore-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (_) {}
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "input"] },
      startup: { typeset: false },
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  <link rel="stylesheet" href="/static/css/explore.css?v={{ version }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
